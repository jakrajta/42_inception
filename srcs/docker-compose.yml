name: inception

services:

  mariadb:
    image: mariadb
    build:
      context: ./requirements/mariadb
    env_file:
      - .env
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - inception
    restart: always
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 5
    secrets:
      - db_user_password
      - db_root_password

  wordpress:
    image: wordpress
    build:
      context: ./requirements/wordpress
    env_file:
      - .env
    volumes:
      - wordpress_data:/var/www/html
    networks:
      - inception
    restart: always
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/usr/local/bin/wp_healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 5
    secrets: 
      - db_user_password
      - wp_admin_password
      - wp_user_password

  nginx:
    image: nginx
    build:
      context: ./requirements/nginx
    env_file:
      - .env
    volumes:
      - wordpress_data:/var/www/html
    networks:
      - inception
    ports:
      - "443:443"
    restart: always
    depends_on:
      wordpress: 
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/usr/local/bin/nginx_healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 5
  
  redis:
    image: redis
    build:
      context: ./requirements/bonus/redis
    networks:
      - inception
    restart: always
    healthcheck:
      test: ["CMD", "/usr/local/bin/redis_healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 5

  adminer:
    image: adminer
    build:
      context: ./requirements/bonus/adminer
    networks:
      - inception
    restart: always
    depends_on:
      mariadb:
        condition: service_healthy

  static:
    image: static
    build:
      context: ./requirements/bonus/static
    networks:
      - inception
    restart: always
    
  ftp:
    image: ftp
    build:
      context: ./requirements/bonus/ftp
    volumes:
      - wordpress_data:/var/www/html
    networks:
      - inception
    ports:
      - "21:21"
      - "21100-21110:21100-21110"
    restart: always
    secrets:
      - ftp_user_password

  monitor:
    image: monitor
    build:
      context: ./requirements/bonus/monitor
    env_file:
      - .env
    networks:
      - inception
    restart: always

networks:
    inception:
      driver: bridge

volumes:
  mariadb_data:
    name: mariadb_data
    driver_opts:
      type: none
      device: /home/jana/data/mariadb
      o: bind
  wordpress_data:
    name: wordpress_data
    driver_opts:
      type: none
      device: /home/jana/data/wordpress
      o: bind

secrets:
  db_root_password:
    file: ../secrets/db_root_password.txt
  db_user_password:
    file: ../secrets/db_user_password.txt
  wp_admin_password:
    file: ../secrets/wp_admin_password.txt
  wp_user_password:
    file: ../secrets/wp_user_password.txt
  ftp_user_password:
    file: ../secrets/ftp_user_password.txt




